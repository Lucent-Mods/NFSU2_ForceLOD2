; NFSU2 ForceLOD 2 - for vanilla NFSU2 and RTX Remix.
; Put NFSU2_ForceLOD2.asi + this file into <game>\scripts\ (needs an ASI loader).
; Menu: INSERT (MenuKey, virtual key code - also selectable in the menu, Status tab). Every value can be changed there and saved back here.
;
; Profile picks all start values at once:
;   Remix   - LOD A everywhere, no reflection / mirror / headlight views, no per-frame decals and post quads:
;             stable geometry hashes for RTX Remix.
;   Vanilla - LOD A everywhere, the game's views and effects as set in the options menu.
; A key below that is missing (or commented out) uses the profile value.

[General]
Profile=Remix
MenuKey=45
Log=1
CrashLog=1
; seconds the streamer may wait for sections before a line goes into the log (0 = off)
HangWatchdog=30
InputBlock=1
InputGuardModules=NFSU_XtendedInput

[LOD]
; scenery smaller than this on screen is not drawn (game pixel scale, vanilla 17)
;WorldMinPixelSize=4
;WorldPixelHysteresis=2
; reflection views also draw LOD A
;ReflectionLodA=1
; 0 = LOD A, -1 = the game decides
;CarLodOverride=0
;CarTyreLodOverride=0
;CullableCarParts=1
;CarMinPixelSize=1
; below this size cars lose wheels and brakes (vanilla 18, 0 = never)
;CarLowDetailPixels=0
;CarBlinkOff=1
; keep every shared LOD unit (X/Y < 50) loaded so LOD A always exists (startup)
;KeepLodAUnits=1
; precull BooBoo map ignored: occlusion culling never switched off by the game (live)
;PrecullBooBooOff=1

[Culling]
; Remix profile (live): objects within N m of the camera are never culled - beside / behind the camera too (Remix lights,
; shadows); 0 = vanilla culling. Profile value Remix 100, Vanilla 0.
;GuardRadius=100
; occlusion data (precull) ignored within N m of the camera. Profile value Remix 200, Vanilla 0.
;PrecullOffRadius=200

[FullMap]
; whole region loaded, real sections drawn instead of the far stand-ins (startup)
;Enable=1
; also draw every other loaded section (far real geometry, expensive) - 0 = loaded only, drawn like vanilla (live)
;DrawExtraSections=1
; far sections use the game's precull (occlusion) data too - the main performance lever (live)
;ExtraPrecull=0
; city panoramas covered by real geometry replaced by the real sections (live)
;ReplacePanoramas=1
; Remix profile only: capture mode - whole region, EVERY object drawn except the panoramas (live); off = Remix exactly vanilla (LOD A)
;RemixCaptureAll=0
; own pixel limit for the far sections, 0 = same as WorldMinPixelSize (live)
;ExtraMinPixelSize=0
; Vanilla profile only: far sections merged into static meshes in the loading screen (far fewer draw calls) - off in Remix
;StaticBatching=1
; upper limit for the merged buffers in MB (VRAM + the managed copy in RAM), next load
;BatchBudgetMB=128
; trees batched too: within 200 m drawn one by one (swaying), farther away merged without sway, next load
;BatchTrees=1

[Despawn]
; live, both profiles: traffic teleported away / encounter cars removed beyond N m (vanilla 250)
;TrafficDistance=400
; light flares (street lamps, neon) fade out up to N m (vanilla 200)
;FlareDistance=400

[Reflections]
; Vanilla profile only, startup: sizes of the game's reflection render targets (off when HD Reflections is installed)
; RoadReflectionScale: 1 = 320x240 (vanilla), 2 = 640x480, 4 = 1280x960
;RoadReflectionScale=1
; CarEnvMapSize: 0 = vanilla 128, else 256 or 512 (cube face)
;CarEnvMapSize=0
; MirrorSize: 0 = vanilla 256, else 512 or 1024
;MirrorSize=0

[Pools]
; all startup values (percent of vanilla)
;StreamingPoolPercent=200
;PackPoolPercent=200
;PolyBufferPercent=400
;FrontEndPoolPercent=100
;DrawListPercent=400
;LaaPointerFix=1
;StreamerLimits=1

[Memory]
; fixes for crashes of the game itself (startup)
;HeapGuard=1
;PoolLock=1
;FileGuard=1
;LowMemD3DX=1

[Settings.Remix]
; engine settings per profile ([Settings.Remix] / [Settings.Vanilla]) - a value of one profile never carries over.
; -1 = game options menu, 0 = off, 1 = on (CarShadow: 2 = high)
;CarShadow=0
;CarHeadlight=0
;Crowd=-1
;Fog=-1
;MotionBlur=0
;LightStreaks=0
;LightGlow=-1
;AnimatedTexture=-1
;ParticleSystem=-1
;DepthOfField=0
;OverBright=0
;BleachByPass=0
;Tinting=0
;HorizonFog=0
;Rain=-1
